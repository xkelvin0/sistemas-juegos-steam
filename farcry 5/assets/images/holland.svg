<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="holland-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b7791f" />
      <stop offset="40%" stop-color="#d69e2e" />
      <stop offset="80%" stop-color="#f6e05e" />
      <stop offset="100%" stop-color="#fefcbf" />
    </linearGradient>
    <linearGradient id="holland-hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#744210" />
      <stop offset="100%" stop-color="#975a16" />
    </linearGradient>
    <linearGradient id="holland-fields" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecc94b" />
      <stop offset="60%" stop-color="#d69e2e" />
      <stop offset="100%" stop-color="#744210" />
    </linearGradient>
  </defs>

  <!-- Cielo de atardecer en Montana -->
  <rect width="800" height="450" fill="url(#holland-sky)" />

  <!-- Cordillera de colinas con el letrero "YES" -->
  <polygon points="-50,300 200,140 450,290" fill="#975a16" opacity="0.6"/>
  <polygon points="250,290 520,110 780,280" fill="url(#holland-hills)" />
  <polygon points="600,280 720,170 850,280" fill="#744210" opacity="0.7"/>

  <!-- Letrero icónico "YES" de John Seed en la montaña -->
  <g transform="translate(430, 140) scale(0.95)">
    <rect x="0" y="0" width="170" height="48" rx="4" fill="rgba(255,255,255,0.92)" stroke="#744210" stroke-width="2"/>
    <text x="85" y="38" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="40" fill="#1a202c" text-anchor="middle" letter-spacing="8">YES</text>
  </g>

  <!-- Campos de trigo y praderas agrícolas -->
  <rect y="260" width="800" height="190" fill="url(#holland-fields)" />

  <!-- Líneas de cultivo en perspectiva -->
  <line x1="100" y1="450" x2="350" y2="260" stroke="#b7791f" stroke-width="4" opacity="0.4"/>
  <line x1="280" y1="450" x2="420" y2="260" stroke="#b7791f" stroke-width="4" opacity="0.4"/>
  <line x1="480" y1="450" x2="500" y2="260" stroke="#b7791f" stroke-width="4" opacity="0.4"/>
  <line x1="680" y1="450" x2="580" y2="260" stroke="#b7791f" stroke-width="4" opacity="0.4"/>

  <!-- Granero rojo clásico de Fall's End y silos de grano del culto -->
  <g transform="translate(140, 210)">
    <!-- Silo 1 del Culto -->
    <rect x="0" y="20" width="34" height="70" rx="4" fill="#cbd5e0" stroke="#4a5568" stroke-width="2"/>
    <path d="M 0,20 Q 17,0 34,20 Z" fill="#e53e3e"/>
    <!-- Cruz de Eden's Gate en el silo -->
    <line x1="17" y1="35" x2="17" y2="55" stroke="#e53e3e" stroke-width="3"/>
    <line x1="9" y1="43" x2="25" y2="43" stroke="#e53e3e" stroke-width="3"/>
    <line x1="11" y1="39" x2="23" y2="47" stroke="#e53e3e" stroke-width="2"/>
    <line x1="11" y1="47" x2="23" y2="39" stroke="#e53e3e" stroke-width="2"/>

    <!-- Silo 2 -->
    <rect x="42" y="30" width="30" height="60" rx="4" fill="#a0aec0" stroke="#4a5568" stroke-width="2"/>
    <path d="M 42,30 Q 57,12 72,30 Z" fill="#e53e3e"/>

    <!-- Granero Americano -->
    <polygon points="90,40 145,5 200,40 200,90 90,90" fill="#9b2c2c"/>
    <polygon points="90,40 145,5 200,40" fill="#c53030"/>
    <rect x="130" y="55" width="30" height="35" fill="#2d3748"/>
    <!-- Puertas con X blanca -->
    <line x1="130" y1="55" x2="160" y2="90" stroke="#ffffff" stroke-width="2"/>
    <line x1="160" y1="55" x2="130" y2="90" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Camión y avión fumigador de Nick Rye en el cielo -->
  <g transform="translate(180, 70) scale(0.6)">
    <polygon points="0,15 45,15 65,0 75,0 60,15 90,15 95,5 105,5 100,20 0,20" fill="#2d3748"/>
    <line x1="30" y1="15" x2="55" y2="35" stroke="#2d3748" stroke-width="4"/>
    <line x1="35" y1="15" x2="60" y2="-5" stroke="#2d3748" stroke-width="4"/>
  </g>

  <!-- Pajar y molino de viento -->
  <g transform="translate(680, 220)">
    <line x1="30" y1="10" x2="30" y2="80" stroke="#4a5568" stroke-width="3"/>
    <circle cx="30" cy="15" r="22" fill="none" stroke="#718096" stroke-width="2"/>
    <line x1="10" y1="15" x2="50" y2="15" stroke="#4a5568" stroke-width="2"/>
    <line x1="30" y1="-5" x2="30" y2="35" stroke="#4a5568" stroke-width="2"/>
    <line x1="16" y1="1" x2="44" y2="29" stroke="#4a5568" stroke-width="2"/>
    <line x1="16" y1="29" x2="44" y2="1" stroke="#4a5568" stroke-width="2"/>
  </g>

  <!-- Insignia y Título -->
  <rect x="30" y="30" width="230" height="40" rx="8" fill="rgba(15,23,42,0.85)" stroke="#f6ad55" stroke-width="1.5"/>
  <text x="45" y="56" font-family="sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="2">HOLLAND VALLEY</text>
</svg>
