<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bliss-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a154b" />
      <stop offset="40%" stop-color="#702459" />
      <stop offset="70%" stop-color="#b83280" />
      <stop offset="100%" stop-color="#fbb6ce" />
    </linearGradient>
    <linearGradient id="bliss-mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f687b3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fed7e2" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="henbane-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#44337a" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
  </defs>

  <!-- Cielo místico saturado de Gozo (The Bliss) -->
  <rect width="800" height="450" fill="url(#bliss-sky)" />

  <!-- Silueta de colinas entre la niebla psicodélica -->
  <polygon points="-40,280 180,140 400,280" fill="#551a8b" opacity="0.5"/>
  <polygon points="350,280 580,120 820,280" fill="#4a154b" opacity="0.6"/>

  <!-- Estatua gigante de Joseph Seed en la montaña -->
  <g transform="translate(370, 75) scale(0.85)">
    <!-- Pedestal de roca -->
    <polygon points="10,180 50,140 90,180" fill="#2d3748"/>
    <!-- Cuerpo y túnica de la estatua -->
    <path d="M 35,60 L 65,60 L 75,140 L 25,140 Z" fill="#e2e8f0"/>
    <!-- Brazos abiertos estilo redentor -->
    <line x1="-15" y1="75" x2="115" y2="75" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round"/>
    <!-- Cabeza y barba -->
    <circle cx="50" cy="40" r="16" fill="#cbd5e0"/>
    <polygon points="42,42 58,42 50,56" fill="#718096"/>
    <!-- El libro en la mano izquierda -->
    <rect x="-24" y="66" width="14" height="20" rx="2" fill="#ffd700"/>
    <!-- Resplandor místico de la estatua -->
    <circle cx="50" cy="70" r="80" fill="#fff5f5" opacity="0.25"/>
  </g>

  <!-- El Río Henbane fluyendo -->
  <path d="M 0,270 Q 250,240 450,275 T 800,260 L 800,450 L 0,450 Z" fill="url(#henbane-water)" />

  <!-- Vapores y nubes de Bliss flotando sobre el agua -->
  <ellipse cx="250" cy="270" rx="260" ry="40" fill="url(#bliss-mist)" filter="blur(8px)" opacity="0.7"/>
  <ellipse cx="600" cy="280" rx="220" ry="35" fill="url(#bliss-mist)" filter="blur(8px)" opacity="0.65"/>

  <!-- Flores blancas de Gozo (Bliss flowers) en primer plano -->
  <g transform="translate(60, 310)">
    <!-- Tallo y hojas -->
    <path d="M 50,110 Q 55,60 40,20" stroke="#22543d" stroke-width="4" fill="none"/>
    <ellipse cx="35" cy="55" rx="14" ry="6" fill="#276749" transform="rotate(-30 35 55)"/>
    <!-- Pétalos blancos radiantes -->
    <circle cx="40" cy="20" r="14" fill="#ffffff" opacity="0.95"/>
    <circle cx="28" cy="14" r="11" fill="#ffffff" opacity="0.9"/>
    <circle cx="52" cy="14" r="11" fill="#ffffff" opacity="0.9"/>
    <circle cx="32" cy="28" r="10" fill="#ffffff" opacity="0.9"/>
    <circle cx="48" cy="28" r="10" fill="#ffffff" opacity="0.9"/>
    <circle cx="40" cy="20" r="6" fill="#f6e05e"/>
    <circle cx="40" cy="20" r="22" fill="#fed7e2" opacity="0.35"/>
  </g>

  <g transform="translate(180, 330) scale(0.8)">
    <path d="M 50,110 Q 45,70 55,30" stroke="#22543d" stroke-width="4" fill="none"/>
    <circle cx="55" cy="30" r="13" fill="#ffffff" opacity="0.95"/>
    <circle cx="44" cy="24" r="10" fill="#ffffff"/>
    <circle cx="66" cy="24" r="10" fill="#ffffff"/>
    <circle cx="55" cy="30" r="5" fill="#f6e05e"/>
  </g>

  <g transform="translate(680, 320)">
    <path d="M 50,110 Q 40,65 50,25" stroke="#22543d" stroke-width="4" fill="none"/>
    <circle cx="50" cy="25" r="14" fill="#ffffff" opacity="0.95"/>
    <circle cx="38" cy="18" r="10" fill="#ffffff"/>
    <circle cx="62" cy="18" r="10" fill="#ffffff"/>
    <circle cx="50" cy="25" r="6" fill="#f6e05e"/>
    <circle cx="50" cy="25" r="20" fill="#fed7e2" opacity="0.4"/>
  </g>

  <!-- Barcaza prisión de Faith en el río -->
  <g transform="translate(480, 290) scale(0.8)">
    <polygon points="0,30 15,10 130,10 145,30" fill="#2d3748"/>
    <rect x="25" y="0" width="85" height="15" fill="#4a5568"/>
    <line x1="68" y1="-15" x2="68" y2="0" stroke="#cbd5e0" stroke-width="2"/>
  </g>

  <!-- Insignia y Título -->
  <rect x="30" y="30" width="220" height="40" rx="8" fill="rgba(15,23,42,0.85)" stroke="#f687b3" stroke-width="1.5"/>
  <text x="45" y="56" font-family="sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="2">HENBANE RIVER</text>
</svg>
