<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mars-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120422" />
      <stop offset="40%" stop-color="#2d0c4b" />
      <stop offset="70%" stop-color="#551a54" />
      <stop offset="100%" stop-color="#8c2538" />
    </linearGradient>
    <linearGradient id="mars-dunes" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c53030" />
      <stop offset="50%" stop-color="#9b2c2c" />
      <stop offset="100%" stop-color="#651a1a" />
    </linearGradient>
  </defs>

  <!-- Espacio y atmósfera marciana -->
  <rect width="800" height="450" fill="url(#mars-sky)" />

  <!-- Estrellas lejanas -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="80" cy="40" r="1.5"/>
    <circle cx="160" cy="80" r="1"/>
    <circle cx="270" cy="30" r="2"/>
    <circle cx="390" cy="65" r="1"/>
    <circle cx="510" cy="25" r="1.5"/>
    <circle cx="640" cy="70" r="2"/>
    <circle cx="750" cy="45" r="1"/>
  </g>

  <!-- La Tierra visible en el firmamento marciano -->
  <circle cx="680" cy="90" r="22" fill="#3182ce"/>
  <circle cx="686" cy="86" r="22" fill="#120422" opacity="0.6"/>
  <ellipse cx="678" cy="92" rx="9" ry="5" fill="#48bb78" opacity="0.8"/>

  <!-- Cordilleras y cañones marcianos -->
  <polygon points="-40,300 160,180 380,310" fill="#742a2a" opacity="0.7"/>
  <polygon points="320,310 560,160 840,300" fill="#742a2a" opacity="0.8"/>

  <!-- Dunas de arena roja y cráteres -->
  <path d="M 0,280 Q 200,240 420,285 T 800,270 L 800,450 L 0,450 Z" fill="url(#mars-dunes)" />

  <!-- Centro de Control de ANNE (Cúpula geodésica futurista) -->
  <g transform="translate(340, 210)">
    <!-- Cúpula de energía -->
    <path d="M 20,70 A 55,55 0 0,1 130,70 Z" fill="rgba(214, 158, 46, 0.25)" stroke="#ecc94b" stroke-width="2"/>
    <ellipse cx="75" cy="70" rx="55" ry="12" fill="#2d3748"/>
    <!-- Torre de Transmisión de Energía marciana -->
    <line x1="75" y1="20" x2="75" y2="-40" stroke="#ecc94b" stroke-width="3"/>
    <circle cx="75" cy="-45" r="8" fill="#d53f8c"/>
    <circle cx="75" cy="-45" r="18" fill="none" stroke="#d53f8c" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Arácnido marciano / Reina alienígena en silueta en la cresta -->
  <g transform="translate(140, 245) scale(0.65)" fill="#1a0b16">
    <ellipse cx="50" cy="30" rx="28" ry="16"/>
    <!-- Patas afiladas -->
    <path d="M 30,35 Q 10,10 0,45" stroke="#1a0b16" stroke-width="4" fill="none"/>
    <path d="M 40,35 Q 25,5 20,50" stroke="#1a0b16" stroke-width="4" fill="none"/>
    <path d="M 60,35 Q 75,5 80,50" stroke="#1a0b16" stroke-width="4" fill="none"/>
    <path d="M 70,35 Q 90,10 100,45" stroke="#1a0b16" stroke-width="4" fill="none"/>
    <!-- Mandíbulas alienígenas -->
    <polygon points="50,42 42,55 58,55"/>
    <circle cx="44" cy="30" r="3" fill="#38b2ac"/>
    <circle cx="56" cy="30" r="3" fill="#38b2ac"/>
  </g>

  <!-- Insignia y Título -->
  <rect x="30" y="30" width="200" height="40" rx="8" fill="rgba(15,23,42,0.85)" stroke="#b794f4" stroke-width="1.5"/>
  <text x="45" y="56" font-family="sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="2">LOST ON MARS</text>
</svg>
